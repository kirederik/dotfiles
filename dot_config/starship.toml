# Starship prompt — clean, informative, fast

format = """
$directory\
$custom\
$git_branch\
$git_status\
$nodejs\
$bun\
$golang\
$rust\
$python\
$fill\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length   = 4
truncate_to_repo    = true
style               = "bold blue"

[custom.jj]
# Show jj change ID + description when inside a jj repo.
# In colocated repos git_branch goes quiet (jj leaves git in detached HEAD).
description = "jj change info"
command     = """jj log --no-graph --ignore-working-copy -r@ \
  --template 'separate(" ", "⬡", change_id.shortest(8), \
    if(local_bookmarks, "(" ++ local_bookmarks.join(", ") ++ ")"), \
    if(conflict, "✗"), if(empty, "∅"), \
    if(description.first_line() != "", description.first_line()))' \
  2>/dev/null"""
when        = "jj root 2>/dev/null"
style       = "bold purple"
format      = "[$output]($style) "

[git_branch]
symbol          = " "
style           = "bold purple"
ignore_branches = ["HEAD"]  # jj always leaves git detached — suppress the noise

[git_status]
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!"
untracked  = "?"
staged     = "+"
renamed    = "»"
deleted    = "✘"

[nodejs]
symbol = " "
detect_files = ["package.json", ".nvmrc", ".node-version"]

[bun]
symbol = "🍞 "

[golang]
symbol = " "

[rust]
symbol = " "

[python]
symbol = " "

[kubernetes]
# Off by default in starship, and $kubernetes must also be added to `format`.
# Always shown (no detect_files/detect_folders) so the target cluster is visible
# before any kubectl runs, not only inside k8s project dirs.
disabled = false
symbol   = "☸ "
style    = "bold cyan"
format   = '[$symbol$context( \($namespace\))]($style) '

# EKS contexts are full ARNs, which would swamp the prompt — and the ARN embeds
# the AWS account ID, which is best kept out of screenshots and screen shares.
# Red because it is not a throwaway local cluster.
[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:(?P<region>[^:]+):\d+:cluster/(?P<cluster>.+)'
context_alias   = 'eks/$cluster'
style           = 'bold red'

# Local kind clusters (kind-platform, kind-worker) are safe to hit.
[[kubernetes.contexts]]
context_pattern = 'kind-.*'
style           = 'bold green'

[cmd_duration]
min_time = 2_000
format   = "[$duration](bold yellow) "

[fill]
symbol = " "
