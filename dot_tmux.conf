# ─── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'catppuccin/tmux'
# tmux-copycat removed — use built-in search instead:
# In copy mode: / (forward) or ? (backward). n/N to cycle matches.

# ─── tmux-open ────────────────────────────────────────────────────────────────
set -g @open          'O'
set -g @open-editor   'C-o'
set -g @open-S        'https://www.google.com/search?q='

# ─── Catppuccin theme ─────────────────────────────────────────────────────────
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_right "prefix_highlight date_time user"
set -g @catppuccin_date_time_text "%a %d %b %H:%M"

# ─── Core ─────────────────────────────────────────────────────────────────────
set-option -g  default-terminal   "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"   # true colour passthrough
set-option -g  focus-events       on               # required for nvim autoread
set-option -g  set-clipboard      on               # use system clipboard
set-option -g  mouse              on

# Window / pane numbering
set -g  base-index       1
set -g  pane-base-index  1
set -g  renumber-windows on     # close window 2 of [1,2,3] → [1,2], not [1,3]

# Misc behaviour
set -g  display-time     1500   # show messages for 1.5s
set -g  history-limit    50000

# ─── Prefix ───────────────────────────────────────────────────────────────────
set-option -g prefix C-space
bind C-space last-window

# ─── Core bindings ────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Vertical split in current path (replaces the default %)
bind v split-window -h -c "#{pane_current_path}"

# Choose paste buffer
bind = choose-buffer -F "#{buffer_size} bytes: #{=60:buffer_sample}"

# ─── vi copy mode ─────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel   # copy and exit mode
bind -T copy-mode-vi C-WheelUpPane   send -X scroll-up
bind -T copy-mode-vi C-WheelDownPane send -X scroll-down

# ─── Unprefixed bindings (C-M-*) ──────────────────────────────────────────────
# Pane navigation
bind-key -n C-M-h select-pane -L
bind-key -n C-M-j select-pane -D
bind-key -n C-M-k select-pane -U
bind-key -n C-M-l select-pane -R
bind-key -n C-M-o select-pane -t :.+   # cycle panes

# Pane management
bind-key -n C-M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key -n C-M-z resize-pane -Z
bind-key -n C-M-\\ setw synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"

# Window navigation
bind-key -n C-M-n     next-window
bind-key -n C-M-p     previous-window
bind-key -n M-Tab     last-window
bind-key -n M-<       swap-window -t -1 \; select-window -t -1
bind-key -n M->       swap-window -t +1 \; select-window -t +1

# Copy / paste
bind-key -n C-M-[  copy-mode
bind-key -n C-M-]  paste-buffer

# Layouts
bind-key -n C-M-Space next-layout

# Last pane / command prompt
bind-key -n M-\;  last-pane
bind-key -n M-:   command-prompt

# Clear pane and scroll history
bind-key -n C-M-c send-keys -R \; clear-history

# Reload (unprefixed, mirrors prefix+r)
bind-key -n C-M-r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── Mouse ────────────────────────────────────────────────────────────────────
# Modern tmux handles mouse well with just `set -g mouse on` (set above).
# These bindings restore scroll-to-copy-mode behaviour that mouse on suppresses.
bind -n WheelUpPane \
    if-shell -F -t= "#{mouse_any_flag}" \
        "send-keys -M" \
        "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
unbind -T copy-mode-vi MouseDragEnd1Pane   # don't exit copy mode on mouse release

# ─── Local overrides ──────────────────────────────────────────────────────────
# Machine-specific config (not committed). Create ~/.tmux.conf.local to use.
source-file -q $HOME/.tmux.conf.local

# ─── Initialise TPM (keep at bottom) ──────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
