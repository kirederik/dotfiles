# Herdr — terminal workspace manager for AI coding agents.
# Agent-aware sibling to Zellij: workspace → tab → pane, with agent lifecycle
# state (idle/working/blocked/done) in the sidebar. See docs/herdr.md.

[theme]
# Match the Zellij setup so both multiplexers look the same during migration.
name = "catppuccin"

# Selection contrast. Herdr has no selection/highlight/border token — the only
# overridable ones are panel_bg, accent, text, red, green, blue, yellow, teal —
# and no selection-style knob under [ui]. So contrast is raised indirectly:
# panel_bg darkens the panel to widen the gap against the theme's selected-row
# background (Mocha crust vs the default base #1e1e2e).
[theme.custom]
panel_bg = "#11111b"

[keys]
# Same leader as Zellij's tmux mode (dot_config/zellij/config.kdl) so muscle
# memory transfers. Herdr's prefix actions are already tmux-shaped:
#   c new tab · n/p tab nav · v/minus split · z zoom · x close · hjkl focus
prefix = "ctrl+space"

# Agent navigation. Herdr has no user-definable sub-modes and no chord
# sequences — `prefix+a n` and `prefix+a 1..9` are both rejected by the parser
# ("invalid keybinding … disabling binding"), so these are single-step.
# focus_agent needs the LEFT option key: macos-option-as-alt = left in
# dot_config/ghostty/config, so right-option does not send a real alt.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

# On-demand jj sidebar refresh. The precmd hook in .zshrc covers normal use;
# this is for when a repo changes underneath you (another pane, an agent, a
# `jj` run elsewhere). type = "shell" runs detached, so nothing steals focus.
# alt+j to stay clear of prefix+j (focus pane down).
[[keys.command]]
key = "prefix+alt+j"
type = "shell"
command = "herdr plugin action invoke refresh --plugin mroth.jj-status"

[ui]
# Group the agent panel by space rather than by attention queue.
agent_panel_sort = "spaces"

# Colours highlights, borders and navigation UI — the closest thing to a
# "selected" colour. Default is "cyan", which reads as very low contrast on
# Catppuccin Mocha. Mocha pink is high-luminance and unmistakable.
accent = "#f5c2e7"

# Sidebar rows for each space. Herdr's built-in `branch`/`git_status` read git
# HEAD, which jj parks detached in colocated repos — so they show a bare hash,
# not the bookmark. The $jj_* tokens come from the mroth.jj-status plugin
# (`herdr plugin install mroth/herdr-jj-status`; needs jj + jq on PATH).
# The plugin clears its tokens outside jj repos, so the git row still covers
# pure-git checkouts. Drop that row if every repo you touch is jj.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["$jj_bookmark", "$jj_status"],
  ["branch", "git_status"],
]

# Popup notifications default to off, which also makes prefix+o
# (open_notification_target) useless — there is no notification to jump to.
# "system" asks the OS notification service; fall back to "terminal" (ask
# Ghostty) or "herdr" (in-app toast) if macOS permissions block it.
[ui.toast]
delivery = "system"
