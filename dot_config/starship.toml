# Starship prompt — clean, informative, fast

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$golang\
$rust\
$python\
$fill\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length   = 4
truncate_to_repo    = true
style               = "bold blue"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!"
untracked  = "?"
staged     = "+"
renamed    = "»"
deleted    = "✘"

[nodejs]
symbol = " "
detect_files = ["package.json", ".nvmrc", ".node-version"]

[bun]
symbol = "🍞 "

[golang]
symbol = " "

[rust]
symbol = " "

[python]
symbol = " "

[cmd_duration]
min_time = 2_000
format   = "[$duration](bold yellow) "

[fill]
symbol = " "
